<body>
  <div class="custom-text">💡 点击当前账单可查历史，手机版请横屏查看 <a href="#" id="clear-highlights">清理所有点击痕迹</a> <b id="namechat"></b>
  </div>
  <div class="custom-text2">
    <div class="radio-group">
        <label>
            <input type="radio" name="gender" value="1" checked> 今日账单群&nbsp;&nbsp;&nbsp;
        </label>
        <label>
            <input type="radio" name="gender" value="2"> 昨日账单群&nbsp;&nbsp;&nbsp;
        </label>
        <label>
            <input type="radio" name="gender" value="3"> 当前账单群&nbsp;&nbsp;&nbsp;
        </label>
        <label>
            <input type="radio" name="gender" value="4"> 全部群组
        </label>
    </div>
    <div id="groupcount" style="color: rgb(192, 80, 77);"></div>
    <br>

     <label for="fruits" class="group-picker-label">👥 群组</label>
     <div class="group-picker">
       <input type="search" id="group-search" placeholder="输入群名称关键词" aria-label="搜索群组" autocomplete="off">
       <select id="fruits" name="fruits"></select>
       <span id="group-search-status" class="group-search-status" role="status"></span>
     </div>
  </div>

  <div class="custom-text2 date-controls" id="date-controls" hidden>
    <span>按时间查</span>
    <div class="date-range">
      <input type="text" id="start-date-input" aria-label="开始时间" title="开始时间">
      <input type="text" id="end-date-input" aria-label="截止时间" title="截止时间">
    </div>
  </div>
  <div id="bill-filter-bar" class="bill-filter-bar">
    <label style="color: rgb(118, 146, 60);">筛选器</label>
    <label><l style="color: rgb(0, 0, 0);">标记人</l>
      <select id="reply-user-filter">
        <option value="全部" selected>全部</option>
      </select>
    </label>
    <label><l style="color: rgb(0, 0, 0);">备注</l>
      <select id="remark-filter">
        <option value="全部" selected>全部</option>
      </select>
    </label>
    <label><l style="color: rgb(0, 0, 0);">操作人</l>
      <select id="operator-filter">
        <option value="全部" selected>全部</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="split-negative-in-filter">
      <l style="color: rgb(0, 0, 0);">出账独立显示</l>
    </label>
  </div>
  <div id="bill-filter-summary" class="bill-filter-summary"></div>

  <div id="bill-error" hidden role="alert"></div>
  <div id="app"><div class="n-config-provider"><section data-v-10d5ad81 id="bill-page"></section></div></div>
